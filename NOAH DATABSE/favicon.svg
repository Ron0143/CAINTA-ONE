<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Cainta One Express courier scooter icon">
  <!-- Gradients define the app icon's blue background and scooter body. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42a5ff"/>
      <stop offset="1" stop-color="#123253"/>
    </linearGradient>
    <linearGradient id="scooter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55b8ff"/>
      <stop offset="1" stop-color="#1760c5"/>
    </linearGradient>
  </defs>
  <!-- Rounded icon background and speed marks. -->
  <rect x="3" y="3" width="90" height="90" rx="25" fill="#09182b"/>
  <rect x="7" y="7" width="82" height="82" rx="22" fill="url(#bg)"/>
  <path d="M13 62h15M17 67h10" fill="none" stroke="#c4eaff" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <path d="M17 35h22v25H17z" rx="3" fill="#4ca1ff" stroke="#fff" stroke-width="2"/>
  <path d="M17 42h22" stroke="#fff" stroke-width="2" opacity=".8"/>
  <text x="28" y="51" fill="#123253" font-family="Arial,sans-serif" font-size="5" font-weight="900" text-anchor="middle">ONE</text>
  <text x="28" y="57" fill="#123253" font-family="Arial,sans-serif" font-size="3.5" font-weight="900" text-anchor="middle">EXPRESS</text>
  <!-- Wheels, scooter frame, rider, and helmet form the delivery illustration. -->
  <circle cx="30" cy="74" r="8" fill="#09182b" stroke="#d8efff" stroke-width="2"/>
  <circle cx="30" cy="74" r="3" fill="#55b8ff"/>
  <circle cx="72" cy="74" r="8" fill="#09182b" stroke="#d8efff" stroke-width="2"/>
  <circle cx="72" cy="74" r="3" fill="#55b8ff"/>
  <path d="M30 70h39l-6 6H36z" fill="url(#scooter)" stroke="#09182b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 69 61 46l8-2 5 25M65 47l10-2" fill="none" stroke="#09182b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 34c4-5 12-5 17 0l7 14-10 7-16-8z" fill="#2180e6" stroke="#09182b" stroke-width="2" stroke-linejoin="round"/>
  <path d="m46 38-9 8 15 5M60 39l10 8-7 4" fill="none" stroke="#123253" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m48 50 12 10 9 5M46 52l-1 10 12 6" fill="none" stroke="#09182b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="54" cy="24" r="9" fill="#efb58d" stroke="#09182b" stroke-width="2"/>
  <path d="M45 23c1-10 17-13 22-4l-2 6-8-3-6 5z" fill="#09182b" stroke="#4ca1ff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M56 24h8" stroke="#d8efff" stroke-width="2" stroke-linecap="round"/>
</svg>
