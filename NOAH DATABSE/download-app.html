<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- This standalone page shares the site's stylesheet and adds download-specific styles. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Cainta One App</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eaf3ff, #dfeefe);
        font-family: Arial, Helvetica, sans-serif;
      }
      .download-box {
        max-width: 620px;
        background: rgba(255,255,255,0.9);
        border: 1px solid rgba(18,50,83,0.12);
        border-radius: 22px;
        padding: 40px 30px;
        box-shadow: 0 20px 40px rgba(18,50,83,0.15);
        text-align: center;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        color: #123253;
        margin-bottom: 16px;
      }
      p {
        color: #4b5d75;
        margin-bottom: 24px;
        line-height: 1.6;
      }
      .download-btn {
        display: inline-block;
        background: #1f72d8;
        color: #fff;
        padding: 14px 26px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }
      .download-btn:hover {
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <!-- The download attribute saves the included app information file. -->
    <div class="download-box">
      <h1>Download Cainta One App</h1>
      <p>
        Get the latest version of the Cainta One app to track deliveries, manage orders,
        and access fast customer support anytime.
      </p>
      <a class="download-btn" href="cainta-one-app.txt" download>Download App</a>
    </div>
  </body>
</html>
